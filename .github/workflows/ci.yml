name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test-and-build:
    name: Test & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      # Build first: the build-artifact test reads dist/manifest.json
      - name: Build Extension (Vite + CRX)
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test
