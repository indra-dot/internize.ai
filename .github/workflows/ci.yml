name: CI & Auto-Update PWA

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-build:
    name: Test & Build Extension + PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      # Build all: compiles extension, packages zip & version.json, builds web app into dist
      - name: Build All (Extension, Packaging & Web App)
        run: npm run build:all

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/internize-ai-extension.zip
          test -f dist/version.json
          test -f internize-ai-extension.zip

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pwa:
    name: Deploy Auto-Updating PWA to GitHub Pages
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
